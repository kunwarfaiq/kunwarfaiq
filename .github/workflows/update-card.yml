# Regenerates the neofetch-style card (dark_mode.svg / light_mode.svg) with live GitHub stats
name: Update profile card

on:
  schedule:
    - cron: '0 3 * * *' # daily
  workflow_dispatch:
  push:
    paths: [generate_card.py, portrait.png]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow numpy

      - name: Build the card
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: |
          if [ -f portrait.png ]; then python generate_card.py --photo portrait.png; else python generate_card.py; fi

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || (git commit -m 'Update profile card' && git push)
